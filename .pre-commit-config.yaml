default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        # Allow certain issues to be fixed automatically:
        # I001: unsorted/unformatted imports (ala isort)
        args: [--fix, --fixable=I001]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v2.4.0'
    hooks:
      - id: mypy
        # Passing filenames to mypy can do odd things. See
        # https://github.com/pre-commit/mirrors-mypy/issues/33.
        # pyproject.toml determines the set of files that will actually be
        # checked.
        pass_filenames: false
        # The pre-commit hook passes some options, but we set options in
        # pyproject.toml.
        args: []
        additional_dependencies: [
          'async-timeout==5.0.1',
          'hypothesis==6.168.5',
          'katcp-codec==0.2.2',
          'pytest==9.1.1',
          'decorator==5.3.1',
          'typing-extensions==4.16.0',
        ]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.6
    hooks:
      - id: pip-compile
        args: [
          "--output-file=requirements.txt",
          "--python-version=3.10",
          "--universal",
          "--group=ci",
          "pyproject.toml",
        ]
        files: '^(pyproject\.toml|requirements\.txt)$'
      - id: pip-compile
        args: [
          "--output-file=doc-requirements.txt",
          "--python-version=3.12",
          "--universal",
          "--group=doc",
          "--constraints=requirements.txt",
          "pyproject.toml",
        ]
        files: '^(pyproject\.toml|requirements\.txt|doc-requirements\.txt)$'
