[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "aiokatcp"
authors = [
    {name = "Bruce Merry", email = "bmerry@sarao.ac.za"}
]
description = "Asynchronous I/O implementation of the katcp protocol"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = [
    "asyncio",
    "katcp",
]
dependencies = [
    "async-timeout>=1.3.0",  # For async context manager support
    "decorator>=4.1",
    "katcp-codec>=0.2.0",
    "typing-extensions",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ska-sa/aiokatcp"
Repository = "https://github.com/ska-sa/aiokatcp"
Documentation = "https://aiokatcp.readthedocs.io/"
Changelog = "https://aiokatcp.readthedocs.io/en/latest/changelog.html"

[project.scripts]
katcpcmd = "aiokatcp.tools.katcpcmd:main"

[dependency-groups]
test = [
    "async-solipsism>=0.8",
    "hypothesis",
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-mock",
]
ci = [
    {include-group = "test"},
    "pre-commit",
    "pytest-cov",
]
doc = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-tikz",
]

[tool.setuptools_scm]
version_file = "src/aiokatcp/_version.py"

[tool.pytest]
markers = [
    "server_cls: internal use",
    "channel_cls: internal use",
    "channel_args: internal use",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["doc/conf.py"]
[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "RUF100",  # Unnecessary noqa directives
]

[tool.mypy]
python_version = "3.10"
files = ["src/aiokatcp", "examples", "tests"]
allow_redefinition = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = "async_solipsism.*"
ignore_missing_imports = true
